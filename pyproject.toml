[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfs-replication-simulator"
version = "0.1.0"
description = "RL agent for optimal HDFS replication factor decisions in a simulated distributed storage cluster"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "tensorboard>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
hadoop = [
    "hdfs>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["hdfs_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
